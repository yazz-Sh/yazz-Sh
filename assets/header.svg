<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.6" stop-color="#140d1f"/>
      <stop offset="1" stop-color="#1e0b25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#be185d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .type { animation: type 2.4s steps(34) 0.4s both; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { animation: fade 0.9s ease-out both; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 2.6s; } .d3 { animation-delay: 3s; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: 862px 270px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- terminal dots -->
    <circle cx="48" cy="44" r="6" fill="#ff5f57"/>
    <circle cx="70" cy="44" r="6" fill="#febc2e"/>
    <circle cx="92" cy="44" r="6" fill="#28c840"/>
    <text x="120" y="49" class="mono" font-size="15" fill="#6b7280">yazz@soc:~</text>

    <text x="48" y="104" class="mono fade d1" font-size="20" fill="#9ca3af"><tspan fill="#f472b6">$</tspan> whoami</text>

    <text x="48" y="172" class="sans fade d1" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Yasmine Shili</text>

    <g class="type">
      <text x="48" y="218" class="mono" font-size="22" fill="url(#accent)">Purple Team · Detection Engineering · Cloud &amp; AI Security</text>
    </g>

    <text x="48" y="256" class="sans fade d2" font-size="18" fill="#9ca3af">Cybersecurity engineering student @ ESPRIT · Tunis · open to France</text>

    <!-- PFE status pill -->
    <g class="fade d3">
      <rect x="840" y="250" width="320" height="42" rx="21" fill="#052e1a" stroke="#22c55e" stroke-opacity="0.6"/>
      <circle class="pulse" cx="862" cy="271" r="6" fill="#22c55e"/>
      <text x="878" y="277" class="sans" font-size="16" font-weight="700" fill="#bbf7d0">Open to PFE · 6 months · Jan 2027</text>
    </g>

    <!-- side tags -->
    <g class="mono fade d2" font-size="14" fill="#6b7280" text-anchor="end">
      <text x="1160" y="104">attack  → <tspan fill="#f472b6">red team / AD</tspan></text>
      <text x="1160" y="130">detect  → <tspan fill="#c084fc">sigma · wazuh · elastic</tspan></text>
      <text x="1160" y="156">harden  → <tspan fill="#a78bfa">aws · k8s · llm</tspan></text>
    </g>
  </g>
</svg>
